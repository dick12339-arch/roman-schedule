<script>
const WORKER_URL = 'https://roman-schedule.yunyunspa.workers.dev';
const WORKER_BACKUP_URL = 'https://roman-schedule-worker.yunyunspa.workers.dev';

// 安全的 storage，data URL iframe 可能不能用 localStorage
function safeGet(key){
  try{ return localStorage.getItem(key); }catch(e){ console.log('storage get fail', e.message); return null; }
}
function safeSet(key, val){
  try{ localStorage.setItem(key, val); }catch(e){ console.log('storage set fail', e.message); }
}

async function fetchWorkerSchedule(){
  const urls = [WORKER_URL + '/api/schedule', WORKER_BACKUP_URL + '/api/schedule'];
  for(let url of urls){
    try{
      console.log('[V397] 嘗試 Worker:', url);
      const res = await fetch(url + '?t=' + Date.now(), {method:'GET', cache:'no-store', mode:'cors'});
      console.log('[V397] 回應狀態', res.status, res.ok);
      if(!res.ok) continue;
      const data = await res.json();
      console.log('[V397] 收到資料', data.raw_text ? data.raw_text.length : 0);
      if(data && data.raw_text && data.raw_text.length > 10){
        return data;
      }
    }catch(e){ 
      console.log('[V397] Worker fetch fail', url, e.message, e); 
    }
  }
  return null;
}

async function pushWorkerSchedule(raw_text){
  const urls = [WORKER_URL + '/api/schedule', WORKER_BACKUP_URL + '/api/schedule'];
  for(let url of urls){
    try{
      console.log('[V397] 推送到 Worker:', url, raw_text.length);
      const res = await fetch(url, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        mode:'cors',
        body: JSON.stringify({raw_text, source:'roman_v397_mobile_safe', updated_by:'roman_site'})
      });
      const data = await res.json();
      console.log('[V397] 推送回應', data);
      if(data && data.success) return data;
    }catch(e){ console.log('[V397] Worker push fail', url, e.message); }
  }
  return null;
}
</script>
</head>

<div class="max-w-[1200px] mx-auto px-3 md:px-6 py-3 md:py-6 grid grid-cols-1 lg:grid-cols-[380px_1fr] gap-4 md:gap-6">
  <div class="space-y-3 md:space-y-4 order-1 lg:order-1">
    <div class="rounded-[16px] md:rounded-[20px] bg-white border border-zinc-200 p-4 md:p-5 shadow-sm">
      <h2 class="text-[13px] font-bold tracking-wide mb-3 md:mb-4 flex items-center gap-2">
        <span>🔄 即時同步控制</span>
        <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-zinc-900 text-white">D1安全</span>
      </h2>
      
      <div class="space-y-3">
        <div>
          <label class="text-[11px] font-mono text-zinc-500 mb-2 block">班表文字（你喜歡的格式）</label>

11 K
..."></textarea>
        </div>

  <div class="space-y-3 md:space-y-4 order-2 lg:order-2">

      <div class="flex flex-col md:flex-row gap-3 md:items-center justify-between mb-3 md:mb-4">
        <div class="flex-1 relative">
          <input id="searchInput" type="text" placeholder="搜尋老師 / 客戶" class="w-full h-[44px] md:h-[40px] rounded-[12px] bg-zinc-50 border border-zinc-200 px-4 pr-10 text-[14px] md:text-[13px] outline-none focus:border-zinc-900 focus:ring-2 focus:ring-zinc-900/10 touch-manipulation">

      </div>

      <div class="mt-3 grid grid-cols-3 gap-2 text-center">
        <div class="rounded-[10px] bg-zinc-50 border border-zinc-100 p-2">

        </div>
        <div class="rounded-[10px] bg-emerald-50 border border-emerald-100 p-2">
          <div class="text-[10px] text-emerald-700">空檔</div>

<div class="h-[env(safe-area-inset-bottom)] md:h-0"></div>

<script>
const LOCATIONS = ["全部","日進","太原","日新","忠誠","大連","南屯"];
let currentFilter = "全部";
let searchQuery = "";

function parseSchedule(text){
  const blocks = text.split(/-{3,}/).map(b=>b.trim()).filter(Boolean);
  const result = [];
  for(let block of blocks){
    const lines = block.split('\n').map(l=>l.trim()).filter(Boolean);
    if(lines.length===0) continue;
    const first = lines[0];
    const m = first.match(/^(.+?)(\d{1,2})(?:[:：]?\d{0,2})?[-—](\d{1,2})(.+)?$/);
    if(!m) continue;
    const name = m[1].trim();
    const start = parseInt(m[2]);
    const end = parseInt(m[3]);
    const location = (m[4]||'').trim();
    const bookings = [];
    for(let i=1;i<lines.length;i++){
      const line = lines[i];
      const bm = line.match(/^(\d{1,2})(?::?(\d{0,2}))?\s*(.+)?$/);
      if(bm){
        const hour = parseInt(bm[1]);
        const customer = (bm[3]||'').trim();
        if(customer) bookings.push({hour, customer});
      }else if(line){
        bookings.push({hour: null, customer: line});
      }
    }
    result.push({name, start, end, location, bookings, raw: block});
  }
  return result;
}

function renderSchedule(){
  const text = document.getElementById('scheduleInput').value;
  const data = parseSchedule(text);
  const display = document.getElementById('scheduleDisplay');
  const q = searchQuery.toLowerCase();
  
  let filtered = data;
  if(currentFilter !== "全部"){
    filtered = filtered.filter(d => d.location.includes(currentFilter) || d.raw.includes(currentFilter));
  }
  if(q){
    filtered = filtered.filter(d => d.name.toLowerCase().includes(q) || d.bookings.some(b=>b.customer.toLowerCase().includes(q)) || d.location.toLowerCase().includes(q));
  }

  document.getElementById('statTeachers').textContent = filtered.length;
  const totalBookings = filtered.reduce((s,d)=>s+d.bookings.length,0);
  document.getElementById('statBookings').textContent = totalBookings;
  const totalSlots = filtered.reduce((s,d)=>{
    let slots = 0;
    if(d.start && d.end){
      slots = d.end >= d.start ? d.end - d.start + 1 : (24 - d.start + d.end + 1);
    }
    return s + Math.max(slots, d.bookings.length);
  },0);
  document.getElementById('statEmpty').textContent = Math.max(0, totalSlots - totalBookings);

  if(filtered.length===0){
    display.innerHTML = `<div class="rounded-[16px] bg-white border border-zinc-200 p-8 text-center text-zinc-500 text-[13px]">沒有符合的班表</div>`;
    return;
  }

  display.innerHTML = filtered.map(teacher=>{
    const locationBadge = teacher.location ? `<span class="text-[10px] px-2 py-0.5 rounded-full bg-zinc-900 text-white">${teacher.location}</span>` : '';
    const timeBadge = (teacher.start!==undefined && teacher.end!==undefined) ? `<span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-zinc-100 border">${teacher.start}-${teacher.end}</span>` : '';
    return `
    <div class="rounded-[16px] md:rounded-[20px] bg-white border border-zinc-200 p-4 md:p-5 shadow-sm">
      <div class="flex items-start justify-between gap-3 mb-3">
        <div class="min-w-0 flex-1">
          <div class="flex flex-wrap items-center gap-2">
            <h3 class="text-[15px] md:text-[16px] font-bold truncate">${teacher.name}</h3>
            ${locationBadge}
            ${timeBadge}
          </div>
          <div class="text-[11px] text-zinc-500 mt-1 font-mono">${teacher.bookings.length} 筆預約</div>
        </div>
        <div class="shrink-0 w-8 h-8 rounded-full bg-zinc-900 text-white flex items-center justify-center text-[11px] font-bold">${teacher.bookings.length}</div>
      </div>
      <div class="space-y-1.5">
        ${teacher.bookings.length===0 ? '<div class="text-[12px] text-zinc-400 py-2 text-center border border-dashed rounded-[10px]">今日無預約</div>' : teacher.bookings.map(b=>{
          const hasCustomer = b.customer && b.customer.trim();
          return `<div class="flex items-center gap-2 text-[12px] min-h-[36px] px-3 rounded-[10px] ${hasCustomer? 'bg-zinc-900 text-white' : 'bg-white border border-dashed border-zinc-300 text-zinc-400'}">
            <span class="font-mono w-10 shrink-0">${b.hour!==null && b.hour!==undefined ? b.hour+':00' : '—'}</span>
            <span class="flex-1 truncate text-[13px]">${hasCustomer? b.customer : '空檔'}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');

  const tabsEl = document.getElementById('filterTabs');
  tabsEl.innerHTML = LOCATIONS.map(loc=>{
    const active = currentFilter===loc;
    return `<button data-loc="${loc}" class="h-[40px] md:h-8 px-4 md:px-3.5 rounded-full text-[13px] md:text-[12px] font-medium whitespace-nowrap border transition-all shrink-0 touch-manipulation active:scale-[0.95] ${active? 'bg-zinc-900 text-white border-zinc-900 shadow-sm' : 'bg-white border-zinc-200 text-zinc-600'}">${loc}</button>`;
  }).join('');
  tabsEl.querySelectorAll('button').forEach(btn=>{
    btn.onclick=()=>{currentFilter=btn.dataset.loc; renderSchedule(); btn.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});};
  });
}

function logSync(msg, source="系統"){
  const logEl = document.getElementById('syncLog');
  if(!logEl) return;
  const time = new Date().toLocaleTimeString();
  const div = document.createElement('div');
  div.className = 'flex gap-2';
  div.innerHTML = `<span class="text-zinc-400">${time}</span><span class="text-zinc-900">${source}</span><span class="flex-1 truncate">${msg}</span>`;
  logEl.prepend(div);
  while(logEl.children.length>20) logEl.removeChild(logEl.lastChild);
}

async function init(){
  const badge = document.getElementById('workerBadge');
  const status = document.getElementById('syncStatus');
  const liveBadge = document.getElementById('d1LiveBadge');
  
  try{
    if(badge) badge.textContent = '載入 Worker D1...';
    if(status) status.textContent = '● 連接 D1 中...';
    logSync('正在連接 Worker D1...', '系統');
    
    const data = await fetchWorkerSchedule();
    if(data && data.raw_text){
      document.getElementById('scheduleInput').value = data.raw_text;
      safeSet('roman_schedule_raw', data.raw_text);
      logSync('✅ 已從 Worker D1 載入 '+data.raw_text.length+' 字', 'Worker D1');
      if(badge){ badge.textContent = '✅ D1 已綁定 '+data.raw_text.length+' 字'; badge.className='text-[10px] px-2 py-0.5 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700'; }
      if(status){ status.textContent = '● 已同步 D1 '+new Date().toLocaleTimeString(); status.className='text-[10px] md:text-[11px] font-mono px-2.5 md:px-3 py-1 md:py-1.5 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700 whitespace-nowrap'; }
      if(liveBadge){ liveBadge.textContent = '● D1 已連接 '+data.raw_text.length+' 字'; liveBadge.className='px-2 py-0.5 rounded-full bg-emerald-500/20 border border-emerald-500/30 text-emerald-300 w-fit'; }
    }else{
      const saved = safeGet('roman_schedule_raw');
      if(saved && saved.length>100){
        document.getElementById('scheduleInput').value = saved;
        logSync('從本地載入 '+saved.length+' 字 (Worker 無資料)', '本地');
      }else{
        logSync('⚠️ Worker 無資料且本地無資料', '警告');
      }
      if(badge){ badge.textContent = '⚠️ Worker 無資料'; badge.className='text-[10px] px-2 py-0.5 rounded-full bg-amber-50 border border-amber-200 text-amber-700'; }
      if(status){ status.textContent = '● 離線模式'; status.className='text-[10px] md:text-[11px] font-mono px-2.5 md:px-3 py-1 md:py-1.5 rounded-full bg-zinc-100 border border-zinc-200 text-zinc-600 whitespace-nowrap'; }
      if(liveBadge){ liveBadge.textContent = '● D1 未連接'; liveBadge.className='px-2 py-0.5 rounded-full bg-amber-500/20 border border-amber-500/30 text-amber-300 w-fit'; }
    }
  }catch(e){
    console.error('Init error', e);
    logSync('初始化錯誤: '+e.message, '錯誤');
    if(badge){ badge.textContent = '❌ 連接失敗'; badge.className='text-[10px] px-2 py-0.5 rounded-full bg-red-50 border border-red-200 text-red-700'; }
    if(status){ status.textContent = '● 連接失敗'; }
    const saved = safeGet('roman_schedule_raw');
    if(saved) document.getElementById('scheduleInput').value = saved;
  }
  
  renderSchedule();

  document.getElementById('btnSyncD1').onclick = async ()=>{
    const text = document.getElementById('scheduleInput').value;
    const btn = document.getElementById('btnSyncD1');
    const original = btn.innerHTML;
    btn.innerHTML = '⏳ 同步中...';
    btn.disabled = true;
    try{
      safeSet('roman_schedule_raw', text);
      logSync('正在同步到 Worker D1...', '手動');
      const result = await pushWorkerSchedule(text);
      if(result && result.success){
        logSync('✅ 已同步 '+text.length+' 字到 Worker D1', '手動');
        document.getElementById('syncStatus').innerHTML = '● 已同步 D1 '+new Date().toLocaleTimeString();
        const liveBadge = document.getElementById('d1LiveBadge');
        if(liveBadge){ liveBadge.textContent = '● D1 已同步'; liveBadge.className='px-2 py-0.5 rounded-full bg-emerald-500/20 border border-emerald-500/30 text-emerald-300 w-fit'; }
        renderSchedule();
      }else{
        logSync('❌ Worker 同步失敗', '錯誤');
      }
    }catch(e){
      logSync('同步失敗: '+e.message, '錯誤');
    }finally{
      btn.innerHTML = original;
      btn.disabled = false;
    }
  };
  
  document.getElementById('btnReloadWorker').onclick = async ()=>{
    const btn = document.getElementById('btnReloadWorker');
    const orig = btn.innerHTML;
    btn.innerHTML = '⏳ 載入中...';
    try{
      const data = await fetchWorkerSchedule();
      if(data && data.raw_text){
        document.getElementById('scheduleInput').value = data.raw_text;
        safeSet('roman_schedule_raw', data.raw_text);
        logSync('✅ 已從 Worker 重新載入 '+data.raw_text.length+' 字', 'Worker D1');
        renderSchedule();
      }else{
        logSync('Worker 無資料', '警告');
      }
    }catch(e){ logSync('載入失敗: '+e.message, '錯誤'); }
    finally{ btn.innerHTML = orig; }
  };
  
  document.getElementById('btnReload').onclick = ()=>{ location.reload(); };
  document.getElementById('btnCopy').onclick = async ()=>{
    try{
      await navigator.clipboard.writeText(document.getElementById('scheduleInput').value);
      logSync('已複製', '系統');
    }catch{ logSync('複製失敗，請手動選取', '錯誤'); }
  };
  
  document.getElementById('scheduleInput').addEventListener('input', ()=>{ 
    renderSchedule();
    document.getElementById('syncStatus').innerHTML = '○ 未同步';
    document.getElementById('syncStatus').className = 'text-[10px] md:text-[11px] font-mono px-2.5 md:px-3 py-1 md:py-1.5 rounded-full bg-amber-50 border border-amber-200 text-amber-700 whitespace-nowrap';
  });
  
  document.getElementById('searchInput').addEventListener('input', (e)=>{ searchQuery=e.target.value; renderSchedule(); });
}

init();
</script>
