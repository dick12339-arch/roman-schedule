name = "roman-schedule"
main = "worker-secure.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "ROMAN_DB"
database_name = "roman-schedule-db"
database_id = "8719bcb8-10e9-4f6e-b6c4-54ccf5a36a91"

[vars]
version = "v401-beautician-secure"
env = "production"
frontend_version = "v401-secure-24h-1030fix"

# --- 請在 Cloudflare Dashboard > Workers > Settings > Variables 設定以下 Secrets，不要直接寫在 toml ---
# SYNC_SECRET = "請在 Dashboard 設為隨機長字串，例如 openssl rand -hex 32"
# LINE_CHANNEL_SECRET = "你的 LINE Channel Secret"
# LINE_CHANNEL_TOKEN = "你的 LINE Channel Access Token"
