name = "roman-schedule"
main = "worker-v4.0.1-github-sync.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# D1 綁定 - 去 Cloudflare Dashboard > D1 > roman-schedule-db 複製 ID 貼在下面
[[d1_databases]]
binding = "ROMAN_DB"
database_name = "roman-schedule-db"
database_id = "REPLACE_WITH_YOUR_D1_ID_FROM_CLOUDFLARE_DASHBOARD"

[vars]
VERSION = "v4.0.1-github-sync"
ENV = "production"
FRONTEND_VERSION = "v4.0.1-pwa-safe"
